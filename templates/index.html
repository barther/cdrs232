<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0b0b">
<title>CD-400U</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #0b0b0b;
    --panel: #171717;
    --line: #2c2c2c;
    --text: #ededed;
    --dim: #8c8c8c;
    --lcd: #0d180d;
    --lcd-line: #1e321e;
    --lcd-dim: #7fa77f;
    --amber: #ffb000;
    --green: #3ddc84;
    --red: #ff5a52;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    max-width: 520px;
    margin: 0 auto;
    padding: 12px 12px 32px;
    padding-top: calc(12px + env(safe-area-inset-top));
    padding-bottom: calc(32px + env(safe-area-inset-bottom));
  }

  @media (min-width: 700px) { .app { max-width: 640px; } }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .title { font-size: 14px; font-weight: 700; letter-spacing: .12em; color: var(--dim); }
  .pill { font-size: 13px; font-weight: 700; letter-spacing: .06em; padding: 4px 12px; border-radius: 999px; border: 1px solid currentColor; }
  .pill.ok { color: var(--green); }
  .pill.bad { color: var(--red); }

  .notice { border: 1px solid var(--red); background: #2b0f0d; color: #ffd6d2; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .warn { border: 1px solid var(--amber); background: #2a2000; color: #ffe2a3; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; }

  .lcd { background: var(--lcd); border: 1px solid var(--lcd-line); border-radius: 14px; padding: 12px 18px 14px; margin-bottom: 12px; }
  .lcd .row { display: flex; justify-content: space-between; align-items: baseline; }
  .lcd .label { font-size: 12px; letter-spacing: .14em; color: var(--lcd-dim); }
  .lcd .big {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 64px; font-weight: 700; line-height: 1.05;
    color: var(--amber); font-variant-numeric: tabular-nums;
  }
  .lcd .state { font-size: 22px; font-weight: 800; letter-spacing: .1em; color: var(--amber); margin-top: 4px; }
  .lcd .info { font-size: 15px; color: var(--lcd-dim); margin-top: 4px; min-height: 20px; }
  .lcd.off .big, .lcd.off .state { color: #4d5f4d; }

  fieldset { border: 0; min-width: 0; }
  button {
    font: inherit; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    min-height: 56px; padding: 0 8px; cursor: pointer;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  button:active:not(:disabled) { background: #262626; }
  button:disabled { opacity: .3; cursor: default; }
  button svg { width: 1em; height: 1em; fill: currentColor; vertical-align: -0.12em; }
  #prev svg, #next svg { width: 26px; height: 26px; }

  .transport { display: grid; grid-template-columns: 1fr 1.7fr 1fr; gap: 8px; }
  .transport button { font-size: 18px; font-weight: 600; }
  #play { min-height: 76px; font-size: 24px; font-weight: 800; color: var(--green); border-color: #1f5a37; }
  #stop { display: block; width: 100%; margin-top: 8px; min-height: 64px; font-size: 22px; font-weight: 800; color: var(--red); border-color: #5c2522; }

  h2 { font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--dim); margin: 20px 2px 8px; }
  .tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; }
  .tracks button { min-height: 54px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tracks button.current { background: #352700; border-color: var(--amber); color: var(--amber); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 6px; }
  .seg button { min-height: 48px; font-size: 15px; font-weight: 600; }
  .seg button.on { background: #2e2300; border-color: var(--amber); color: var(--amber); }

  details { margin-top: 20px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
  summary { padding: 16px 2px; font-size: 15px; font-weight: 700; letter-spacing: .08em; color: var(--dim); cursor: pointer; }
  details[open] { padding-bottom: 14px; }
  details h2:first-of-type { margin-top: 0; }
  #eject { width: 100%; margin-top: 18px; color: var(--dim); }

  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%); max-width: 90%;
    background: #3a1210; border: 1px solid var(--red); color: #ffd6d2;
    padding: 10px 16px; border-radius: 10px; font-size: 15px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">TASCAM CD-400U</div>
    <div class="pill bad" id="pill">CONNECTING</div>
  </header>

  <div class="notice" id="notice" hidden></div>
  <div class="warn" id="warn" hidden></div>

  <div class="lcd off" id="lcd">
    <div class="row"><span class="label">TRACK</span><span class="label">TIME</span></div>
    <div class="row"><span class="big" id="track">--</span><span class="big" id="time">--:--</span></div>
    <div class="state" id="state">CONNECTING</div>
    <div class="info" id="info"></div>
  </div>

  <fieldset id="controls" disabled>
    <div class="transport">
      <button id="prev" aria-label="Previous track"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="2" height="10"/><path d="M14 3L5 8l9 5z"/></svg></button>
      <button id="play"></button>
      <button id="next" aria-label="Next track"><svg viewBox="0 0 16 16"><path d="M2 3l9 5-9 5z"/><rect x="12" y="3" width="2" height="10"/></svg></button>
    </div>
    <button id="stop"><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10"/></svg> STOP</button>

    <section id="tracksSection" hidden>
      <h2>TRACKS</h2>
      <div class="tracks" id="tracks"></div>
    </section>

    <section id="tunerSection" hidden>
      <h2>TUNER</h2>
      <div class="grid2">
        <button data-post="/api/tuner/frequency/down">TUNE &minus;</button>
        <button data-post="/api/tuner/frequency/up">TUNE +</button>
        <button data-post="/api/tuner/seek/down"><svg viewBox="0 0 16 16"><path d="M8 3L1 8l7 5z"/><path d="M15 3L8 8l7 5z"/></svg> SEEK</button>
        <button data-post="/api/tuner/seek/up">SEEK <svg viewBox="0 0 16 16"><path d="M1 3l7 5-7 5z"/><path d="M8 3l7 5-7 5z"/></svg></button>
      </div>
      <h2>PRESETS</h2>
      <div class="seg" id="presets"></div>
    </section>

    <details>
      <summary>MORE</summary>
      <h2>SOURCE</h2>
      <div class="seg" id="sources">
        <button data-device="cd">CD</button>
        <button data-device="usb">USB</button>
        <button data-device="sd">SD</button>
        <button data-device="bluetooth">BT</button>
        <button data-device="fm">FM</button>
        <button data-device="am">AM</button>
        <button data-device="aux">AUX</button>
      </div>
      <h2>PLAY MODE</h2>
      <div class="seg" id="modes">
        <button data-mode="continuous">Continuous</button>
        <button data-mode="single">Single</button>
        <button data-mode="random">Random</button>
      </div>
      <h2>REPEAT</h2>
      <div class="seg">
        <button id="repeat">OFF</button>
      </div>
      <h2>SEARCH (HOLD)</h2>
      <div class="grid2">
        <button id="rew"><svg viewBox="0 0 16 16"><path d="M8 3L1 8l7 5z"/><path d="M15 3L8 8l7 5z"/></svg> REW</button>
        <button id="ffwd">FFWD <svg viewBox="0 0 16 16"><path d="M1 3l7 5-7 5z"/><path d="M8 3l7 5-7 5z"/></svg></button>
      </div>
      <button id="eject"><svg viewBox="0 0 16 16"><path d="M8 2L2 9h12z"/><rect x="2" y="11" width="12" height="2.5"/></svg> EJECT DISC</button>
    </details>
  </fieldset>
</div>
<div id="toast" role="status"></div>

<script>
(function () {
  'use strict';

  var POLL_MS = 300;          // page refresh while visible
  var POLL_HIDDEN_MS = 3000;  // while the phone is locked / tab hidden
  var PLAYING = ['play', 'search_forward', 'search_backward'];
  var RIGHT = '▶︎', LEFT = '◀︎';  // FE0E: text glyph, not emoji
  var STATE_TEXT = {
    play: RIGHT + ' PLAYING',
    ready: '❚❚ PAUSED',
    stop: '■ STOPPED',
    no_media: 'NO DISC',
    ejecting: 'EJECTING',
    search_forward: RIGHT + RIGHT + ' SEARCHING',
    search_backward: LEFT + LEFT + ' SEARCHING'
  };
  var PLAY_HTML = '<svg viewBox="0 0 16 16"><path d="M3 2l11 6-11 6z"/></svg> PLAY';
  var PAUSE_HTML = '<svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg> PAUSE';
  var NO_DISC = ['no_media', 'ejecting', 'unknown'];

  var $ = function (id) { return document.getElementById(id); };
  var status = null;      // last /api/status reply; null when the Pi can't be reached
  var shownTracks = -1;   // track count the grid was built for
  var playShowsPause = null;

  // --- server ---

  var pollTimer = null, inFlight = false, pollAgain = false;

  function poll() {
    if (inFlight) { pollAgain = true; return; }
    inFlight = true;
    clearTimeout(pollTimer);
    var abort = window.AbortController ? new AbortController() : null;
    var timeout = setTimeout(function () { if (abort) abort.abort(); }, 3000);
    fetch('/api/status', { cache: 'no-store', signal: abort ? abort.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (s) { status = s; })
      .catch(function () { status = null; })
      .then(function () {
        clearTimeout(timeout);
        inFlight = false;
        render();
        if (pollAgain) { pollAgain = false; poll(); return; }
        pollTimer = setTimeout(poll, document.hidden ? POLL_HIDDEN_MS : POLL_MS);
      });
  }

  function post(path, body) {
    return fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      if (!r.ok) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          toast(j.message || 'Command failed');
        });
      }
    }).catch(function () {
      toast("Can't reach the controller");
    }).then(poll);
  }

  var toastTimer = null;
  function toast(text) {
    var el = $('toast');
    el.textContent = text;
    el.className = 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = ''; }, 2500);
  }

  // --- rendering ---

  function render() {
    var s = status;
    var online = !!(s && s.online);
    var notice = '';
    if (!s) notice = "Can't reach the controller. Check this device's Wi-Fi and that the Pi is powered on.";
    else if (!s.port_open) notice = 'The USB serial adapter isn\'t connected to the Pi. Check the cable; it reconnects by itself.';
    else if (!online) notice = 'The CD player isn\'t answering. Check that it\'s switched on and the serial cable is plugged in.';

    $('pill').textContent = online ? 'ONLINE' : (s ? 'OFFLINE' : 'NO SERVER');
    $('pill').className = 'pill ' + (online ? 'ok' : 'bad');
    $('notice').textContent = notice;
    $('notice').hidden = !notice;
    $('controls').disabled = !online;
    $('lcd').className = online ? 'lcd' : 'lcd off';

    var mecha = online ? s.mecha_status : 'unknown';
    var hasDisc = online && NO_DISC.indexOf(mecha) < 0;
    $('track').textContent = hasDisc && s.track_number > 0 ? pad2(s.track_number) : '--';
    $('time').textContent = hasDisc ? s.time_elapsed : '--:--';
    $('state').textContent = online ? (STATE_TEXT[mecha] || '—') : 'OFFLINE';

    var info = [];
    if (online) {
      info.push(s.device_name);
      if (hasDisc && s.total_tracks > 0) info.push(s.total_tracks + (s.is_tuner ? ' presets' : ' tracks'));
      if (hasDisc && s.total_time && s.total_time !== '00:00') info.push(s.total_time + ' total');
    }
    $('info').textContent = info.join(' · ');

    var playing = online && PLAYING.indexOf(mecha) >= 0;
    if (playing !== playShowsPause) {  // only touch the DOM on change, so taps aren't lost
      playShowsPause = playing;
      $('play').innerHTML = playing ? PAUSE_HTML : PLAY_HTML;
    }

    renderTracks(online && !s.is_tuner && hasDisc ? s.total_tracks : 0, online ? s.track_number : 0);
    $('tunerSection').hidden = !(online && s.is_tuner);

    markOn('#sources button', 'device', online && s.device);
    markOn('#modes button', 'mode', online && s.play_mode);
    var repeat = online && s.repeat_mode;
    $('repeat').textContent = repeat ? 'ON' : 'OFF';
    $('repeat').className = repeat ? 'on' : '';

    var problems = [];
    if (online && s.error_status && s.error_status.has_error) problems = problems.concat(s.error_status.errors);
    if (online && s.caution_status && s.caution_status.has_caution) problems = problems.concat(s.caution_status.cautions);
    $('warn').textContent = problems.length ? '⚠ ' + problems.map(function (p) { return p.replace(/_/g, ' '); }).join(' · ') : '';
    $('warn').hidden = !problems.length;
  }

  function renderTracks(count, current) {
    var grid = $('tracks');
    if (count !== shownTracks) {
      shownTracks = count;
      grid.innerHTML = '';
      for (var n = 1; n <= count; n++) {
        var b = document.createElement('button');
        b.textContent = n;
        b.setAttribute('data-track', n);
        grid.appendChild(b);
      }
      $('tracksSection').hidden = count === 0;
    }
    var buttons = grid.children;
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].className = (i + 1 === current) ? 'current' : '';
    }
  }

  function markOn(selector, attr, value) {
    var buttons = document.querySelectorAll(selector);
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].className = buttons[i].getAttribute('data-' + attr) === value ? 'on' : '';
    }
  }

  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  // --- controls ---

  $('play').addEventListener('click', function () {
    var playing = status && status.online && PLAYING.indexOf(status.mecha_status) >= 0;
    post(playing ? '/api/pause' : '/api/play');
  });
  $('stop').addEventListener('click', function () { post('/api/stop'); });
  $('prev').addEventListener('click', function () { post('/api/previous'); });
  $('next').addEventListener('click', function () { post('/api/next'); });
  $('repeat').addEventListener('click', function () {
    post('/api/repeat', { enabled: !(status && status.repeat_mode) });
  });
  $('eject').addEventListener('click', function () {
    if (window.confirm('Eject the disc?')) post('/api/eject');
  });

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b || b.matches(':disabled')) return;
    if (b.hasAttribute('data-track')) post('/api/track/' + b.getAttribute('data-track'));
    else if (b.hasAttribute('data-device')) post('/api/device/' + b.getAttribute('data-device'));
    else if (b.hasAttribute('data-mode')) post('/api/mode/' + b.getAttribute('data-mode'));
    else if (b.hasAttribute('data-post')) post(b.getAttribute('data-post'));
  });

  for (var p = 1; p <= 6; p++) {
    var pb = document.createElement('button');
    pb.textContent = p;
    pb.setAttribute('data-post', '/api/tuner/preset/' + p);
    $('presets').appendChild(pb);
  }

  // Search runs while the button is held and stops when it's released.
  function holdToSearch(btn, forward) {
    var held = false;
    function start(e) {
      if (btn.matches(':disabled')) return;  // the fieldset disables it while offline
      e.preventDefault();
      held = true;
      post('/api/search/start', { forward: forward });
    }
    function end() {
      if (!held) return;
      held = false;
      post('/api/search/stop');
    }
    if (window.PointerEvent) {
      btn.addEventListener('pointerdown', start);
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { btn.addEventListener(t, end); });
    } else {
      btn.addEventListener('touchstart', start);
      btn.addEventListener('mousedown', start);
      ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(function (t) { btn.addEventListener(t, end); });
    }
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  holdToSearch($('rew'), false);
  holdToSearch($('ffwd'), true);

  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });

  poll();

  if ('serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register('/service-worker.js', { scope: '/' }).catch(function () {});
  }
})();
</script>
</body>
</html>
